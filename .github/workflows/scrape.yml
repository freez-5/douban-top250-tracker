name: Scrape Top 250 Data

# 触发条件
on:
  # 每周一UTC 0点运行（北京时间早上8点）
  schedule:
    - cron: '0 0 * * 1'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因'
        required: false
        default: '手动更新数据'

# 权限配置
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 运行豆瓣爬虫
      - name: Scrape Douban Top 250
        run: python scripts/scrape.py
        env:
          PYTHONIOENCODING: utf-8

      # 运行IMDB爬虫
      - name: Scrape IMDB Top 250
        run: python scripts/scrape_imdb.py
        env:
          PYTHONIOENCODING: utf-8

      # 检查数据是否更新
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      # 提交并推送更改
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "📊 Update Top 250 data $(date +%Y-%m-%d)"
          git push

      # 如果没有变化，输出提示
      - name: No changes message
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "No changes detected in Top 250 data"

      # 上传数据作为制品（可选，用于调试）
      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top250-data
          path: data/
          retention-days: 30
